apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskapi-alerts
  namespace: taskapi
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: taskapi.rules
      rules:
        # Standard SRE Multi-window Burn Rate Alert (Page on rapid error budget exhaustion)
        - alert: TaskAPISLOBurnRateFast
          expr: |
            (
              sum(rate(http_requests_total{job="taskapi",status=~"5.."}[1h]))
              /
              sum(rate(http_requests_total{job="taskapi"}[1h]))
            ) > (14.4 * (1 - 0.999))
            and
            (
              sum(rate(http_requests_total{job="taskapi",status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="taskapi"}[5m]))
            ) > (14.4 * (1 - 0.999))
          for: 2m
          labels:
            severity: critical
            tier: api
          annotations:
            summary: "Task API fast error budget burn rate (14.4x)"
            description: "High error rate is consuming 2% of the monthly error budget in 1 hour."

        - alert: TaskAPIHighErrorRate
          expr: |
            sum(rate(http_requests_total{job="taskapi",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="taskapi"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Task API 5xx error rate above 5%"
            description: "More than 5% of requests have returned 5xx for 5 minutes. Check recent deploys and pod logs."

        - alert: TaskAPIHighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="taskapi"}[5m])) by (le)) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Task API p95 latency above 1s"
            description: "95th percentile request latency has exceeded 1 second for 10 minutes."

        - alert: TaskAPIPodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{container="taskapi"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Task API pod restarting repeatedly"
            description: "A taskapi pod has restarted more than 3 times in 15 minutes - likely crash-looping."

        - alert: TaskAPINoHealthyPods
          expr: |
            kube_deployment_status_replicas_available{deployment="taskapi"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "No healthy Task API pods available"
            description: "The taskapi Deployment has zero available replicas - the service is down."

        - alert: TaskAPIHPAMaxedOut
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="taskapi-hpa"}
            >=
            kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler="taskapi-hpa"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Task API HPA at max replicas"
            description: "Autoscaler has been at its max replica count for 10+ minutes - consider raising maxReplicas or investigating load."

        - alert: TaskAPICacheDegraded
          expr: |
            rate(taskapi_cache_operations_total{status="error"}[5m]) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Task API Redis cache operation errors"
            description: "Redis cache is experiencing recurring communication errors; requests are falling back to Postgres."