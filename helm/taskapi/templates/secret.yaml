# DEMO VALUES - override with --set or a non-committed values file.
# For real deployments, prefer Helm Secrets, SOPS, or External Secrets
# Operator instead of plaintext values in a Helm release.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskapi.name" . }}-secret
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
