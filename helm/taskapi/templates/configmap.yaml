apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskapi.name" . }}-config
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  CACHE_ENABLED: {{ .Values.config.cacheEnabled | quote }}
