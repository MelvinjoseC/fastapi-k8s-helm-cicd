# helm upgrade --install taskapi ./helm/taskapi -f helm/taskapi/values-prod.yaml \
#   --set secrets.postgresPassword=$PROD_DB_PASSWORD
replicaCount: 5

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  minReplicas: 5
  maxReplicas: 20

config:
  appEnv: production
  logLevel: warning

ingress:
  host: taskapi.yourcompany.com
