apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskapi-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: taskapi
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
  - target:
      kind: HorizontalPodAutoscaler
      name: taskapi-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi

configMapGenerator:
  - name: taskapi-config
    behavior: merge
    literals:
      - APP_ENV=production
      - LOG_LEVEL=warning

# In a real prod deployment, ingress.yaml's host would also be patched
# to the production domain, and secret.yaml would be replaced entirely
# by a Sealed Secret / External Secret rather than committed here.
