apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskapi-staging

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: taskapi
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
  - target:
      kind: HorizontalPodAutoscaler
      name: taskapi-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target:
      kind: Ingress
      name: taskapi-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: taskapi-staging.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: taskapi-staging.example.com

configMapGenerator:
  - name: taskapi-config
    namespace: taskapi
    behavior: merge
    literals:
      - APP_ENV=staging
      - LOG_LEVEL=info