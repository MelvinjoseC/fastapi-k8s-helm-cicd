# Default-deny posture: only allow the traffic this app actually needs.
# Prevents lateral movement across namespaces and restricts egress strictly
# to authorized dependencies: Postgres, Redis, and CoreDNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taskapi-network-policy
  namespace: taskapi
spec:
  podSelector:
    matchLabels:
      app: taskapi
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress from ingress-nginx controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # Ingress from Prometheus monitoring scrapers
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
    # Ingress from within release namespace (e.g. migration job or smoke test)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Egress to PostgreSQL StatefulSet
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Egress to Redis cache
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Egress strictly to kube-system CoreDNS for cluster name resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53