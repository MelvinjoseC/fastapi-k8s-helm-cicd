apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskapi

commonLabels:
  app.kubernetes.io/part-of: taskapi-platform
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - migration-job.yaml

images:
  - name: ghcr.io/MelvinjoseC/fastapi-k8s-helm-cicd
    newTag: latest
