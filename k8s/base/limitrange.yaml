apiVersion: v1
kind: LimitRange
metadata:
  name: taskapi-limitrange
  labels:
    app.kubernetes.io/name: taskapi-limitrange
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      min:
        cpu: 25m
        memory: 32Mi
      max:
        cpu: "2"
        memory: 2Gi