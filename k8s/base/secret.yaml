# real cluster, replace this file with one of:
#   - Sealed Secrets   (bitnami-labs/sealed-secrets) - encrypt at rest in git
#   - External Secrets Operator - pull from AWS Secrets Manager / Vault / GCP SM
#   - SOPS + kustomize secretGenerator
#
# Regenerate values with:
#   echo -n 'your-value' | base64
