name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/taskapi

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "app/requirements-dev.txt"
      - run: pip install -r app/requirements-dev.txt
      - run: flake8 --max-line-length=110 --extend-ignore=E203,W503 app --exclude=app/tests/__pycache__
      - run: black --check app
      - run: bandit -r app -x app/tests
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint Helm Chart
        run: helm lint helm/taskapi
      - name: Validate Helm Chart rendering (dry-run)
        run: helm template taskapi-test helm/taskapi --values helm/taskapi/values.yaml --debug > /dev/null




  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "app/requirements-dev.txt"
      - run: pip install -r app/requirements-dev.txt
      - name: Run pytest with coverage
        working-directory: app
        run: pytest -v --maxfail=1
      - name: Smoke test the running server
        working-directory: app
        run: |
          CACHE_ENABLED=false uvicorn main:app --port 8001 &
          sleep 3
          curl -sf http://127.0.0.1:8001/health
          curl -sf http://127.0.0.1:8001/metrics > /dev/null

  build-and-scan:
    name: Build image & scan for vulnerabilities
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0" # set to "1" once the codebase is hardened enough to gate merges on this

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

  k8s-smoke-test:
    name: Deploy to kind & verify rollout
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for kind (local only, not pushed)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          tags: taskapi:ci-test
          load: true

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: taskapi-ci

      - name: Load image into kind
        run: kind load docker-image taskapi:ci-test --name taskapi-ci

      - name: Point manifests at the locally-built image
        run: |
          cd k8s/overlays/dev
          kustomize edit set image ghcr.io/MelvinjoseC/fastapi-k8s-helm-cicd=taskapi:ci-test

      - name: Deploy via Kustomize
        run: kubectl apply -k k8s/overlays/dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/taskapi -n taskapi-dev --timeout=120s
          kubectl rollout status statefulset/postgres -n taskapi-dev --timeout=120s

      - name: Hit the health endpoint through the cluster
        run: |
          kubectl port-forward -n taskapi-dev svc/taskapi 8080:80 &
          sleep 5
          curl -sf http://127.0.0.1:8080/health
          curl -sf http://127.0.0.1:8080/ready

      - name: Dump pod state on failure
        if: failure()
        run: |
          kubectl get pods -n taskapi-dev
          kubectl describe pods -n taskapi-dev
          kubectl logs -n taskapi-dev -l app=taskapi --tail=100
