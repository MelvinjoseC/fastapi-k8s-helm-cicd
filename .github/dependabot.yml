version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain Python dependencies
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"

  # Maintain Helm Chart dependencies
  - package-ecosystem: "helm"
    directory: "/helm/taskapi"
    schedule:
      interval: "weekly"
