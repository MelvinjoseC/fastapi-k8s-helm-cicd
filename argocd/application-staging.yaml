apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskapi-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: taskapi
    app.kubernetes.io/part-of: taskapi-platform
    environment: staging
spec:
  project: default
  source:
    repoURL: https://github.com/MelvinjoseC/fastapi-k8s-helm-cicd.git
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: taskapi-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true